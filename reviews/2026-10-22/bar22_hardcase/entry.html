<script>window.__BENCHMARK__={"duration": 58.09, "sentences": [{"start": 0.0, "end": 7.958, "text": "The chart is a vertical bar chart comparing net worth across six categories, with an annotation for ultra-rich households."}, {"start": 8.258, "end": 14.091, "text": "Starting at the bottom, the cashier’s net worth is -$4,000."}, {"start": 14.391, "end": 20.499, "text": "The next bars show a working mom at $1,000 and an office clerk at $2,000."}, {"start": 20.799, "end": 27.978, "text": "Further up, a nurse has a net worth of $26,000 and a teacher has $32,000."}, {"start": 28.278, "end": 35.071, "text": "The accountant’s net worth is $110,000, the highest value displayed on the axis."}, {"start": 35.371, "end": 42.894, "text": "The ultra-rich households annotation has no displayed bar value because its net worth is far beyond the displayed axis."}, {"start": 43.194, "end": 50.926, "text": "The resulting contrast is modest or negative net worth for ordinary occupations versus wealth concentrated at the ultra-rich end."}, {"start": 51.226, "end": 57.794, "text": "That contrast is the basis for showing how a wealth tax could target ultra-rich wealth to finance programs."}]};</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Net Worth by Occupation</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b1220; }
  body { display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
  #stage {
    position: relative; width: 1280px; height: 720px; overflow: hidden;
    background: #ffffff;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
  }
  #chart { display: block; width: 1280px; height: 720px; }
  #subtitle {
    position: absolute; left: 60px; right: 60px; bottom: 6px; min-height: 76px;
    box-sizing: border-box; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 8px 28px;
    background: rgba(15, 23, 42, 0.90); color: #ffffff;
    font-size: 20px; line-height: 1.35; border-radius: 14px; letter-spacing: .1px;
  }
  #play {
    position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 5;
    padding: 9px 22px; border: none; border-radius: 999px;
    background: #2563eb; color: #ffffff;
    font: 600 15px/1 "Segoe UI", system-ui, sans-serif; cursor: pointer;
    box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
  }
  #play:hover { background: #1d4ed8; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="chart" width="1280" height="720"></canvas>
  <div id="subtitle"></div>
  <button id="play">▶ Play</button>
  <audio id="tts" src="audio/tts.wav"></audio>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     CANVAS SETUP
     ============================================================ */
  var W = 1280, H = 720;
  var canvas = document.getElementById('chart');
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  /* ============================================================
     DATA — exactly the six bar rows from the table
     ============================================================ */
  var DATA = [
    { name: 'Cashier',      value: -4000,  fmt: '-$4,000'  },
    { name: 'Working mom',  value: 1000,   fmt: '$1,000'   },
    { name: 'Office clerk', value: 2000,   fmt: '$2,000'   },
    { name: 'Nurse',        value: 26000,  fmt: '$26,000'  },
    { name: 'Teacher',      value: 32000,  fmt: '$32,000'  },
    { name: 'Accountant',   value: 110000, fmt: '$110,000' }
  ];

  /* ============================================================
     LAYOUT / SCALE
     ============================================================ */
  var PLOT = { x: 160, y: 180, w: 960, h: 400 };
  var VMIN = -15000, VMAX = 125000;
  function yS(v) { return PLOT.y + PLOT.h * (VMAX - v) / (VMAX - VMIN); }
  var ZERO = yS(0);
  var SLOT = PLOT.w / 6;
  var BARW = 92;
  var CENTERS = DATA.map(function (_, i) { return PLOT.x + SLOT * (i + 0.5); });

  /* ============================================================
     TIMELINE
     ============================================================ */
  var BENCH = window.__BENCHMARK__;

  var SENTENCES = (BENCH && BENCH.sentences && BENCH.sentences.length) ? BENCH.sentences : [
    { start: 0.000,  end: 7.958,  text: "The chart is a vertical bar chart comparing net worth across six categories, with an annotation for ultra-rich households." },
    { start: 8.258,  end: 14.091, text: "Starting at the bottom, the cashier’s net worth is -$4,000." },
    { start: 14.391, end: 20.499, text: "The next bars show a working mom at $1,000 and an office clerk at $2,000." },
    { start: 20.799, end: 27.978, text: "Further up, a nurse has a net worth of $26,000 and a teacher has $32,000." },
    { start: 28.278, end: 35.071, text: "The accountant’s net worth is $110,000, the highest value displayed on the axis." },
    { start: 35.371, end: 42.894, text: "The ultra-rich households annotation has no displayed bar value because its net worth is far beyond the displayed axis." },
    { start: 43.194, end: 50.926, text: "The resulting contrast is modest or negative net worth for ordinary occupations versus wealth concentrated at the ultra-rich end." },
    { start: 51.226, end: 57.794, text: "That contrast is the basis for showing how a wealth tax could target ultra-rich wealth to finance programs." }
  ];

  var DURATION = (BENCH && typeof BENCH.duration === 'number' && isFinite(BENCH.duration))
    ? BENCH.duration
    : SENTENCES[SENTENCES.length - 1].end;

  function sent(i) { return SENTENCES[i] || { start: 0, end: DURATION }; }

  function mkPlan(i, shows, ch, bars) {
    var s = sent(i);
    var a = Math.max(s.start, Math.min(s.end, ch[0]));
    var b = Math.max(a + 0.001, Math.min(s.end, ch[1]));
    return {
      sentence: i,
      window: [s.start, s.end],
      shows: shows,
      change: [Math.round(a * 1000) / 1000, Math.round(b * 1000) / 1000],
      bars: bars || []
    };
  }

  /* ============================================================
     PLAN — one entry per sentence, no omissions
     ============================================================ */
  var PLAN = [
    mkPlan(0,
      'Bar-chart frame is on screen: title, y-axis with $0–$100,000 gridlines, zero baseline and the six category labels; the ultra-rich annotation banner and its off-scale arrow fade in on the right.',
      [0.30, 6.50]),
    mkPlan(1,
      'Cashier bar grows downward below the zero line to -$4,000, and its value label appears.',
      [8.60, 12.90], [0]),
    mkPlan(2,
      'Working mom bar grows up to $1,000, then the office clerk bar grows to $2,000, each with its value label.',
      [14.70, 19.90], [1, 2]),
    mkPlan(3,
      'Nurse bar grows up to $26,000, then the teacher bar grows to $32,000, each with its value label.',
      [21.10, 27.20], [3, 4]),
    mkPlan(4,
      'Accountant bar grows up to $110,000, the highest value displayed on the axis.',
      [28.60, 33.20], [5]),
    mkPlan(5,
      'The ultra-rich annotation banner and its off-scale arrow pulse above the axis; no bar value is shown for it.',
      [35.70, 42.50]),
    mkPlan(6,
      'All six bars glow together, the zero line thickens, and a two-line caption states the -$4,000 to $110,000 range against the still-lit off-scale annotation.',
      [43.50, 50.40]),
    mkPlan(7,
      'The off-scale ultra-rich arrow turns green and is bracketed as the wealth tax target.',
      [51.50, 57.20])
  ];
  window.__PLAN__ = PLAN;

  /* ============================================================
     BUILD BAR GROWTH WINDOWS BY LOOPING OVER PLAN
     ============================================================ */
  var BAR_WINDOWS = DATA.map(function () { return [0, 0.001]; });
  PLAN.forEach(function (p) {
    if (!p.bars.length) return;
    var a = p.change[0], b = p.change[1], n = p.bars.length;
    p.bars.forEach(function (bi, k) {
      BAR_WINDOWS[bi] = [a + (b - a) * k / n, a + (b - a) * (k + 1) / n];
    });
  });

  /* ============================================================
     MATH HELPERS
     ============================================================ */
  function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
  function prog(t, a, b) { return b <= a ? (t >= b ? 1 : 0) : clamp01((t - a) / (b - a)); }
  function easeOut(p) { return 1 - Math.pow(1 - p, 3); }
  function easeInOut(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }
  function mix(a, b, t) {
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }

  function roundRect(c, x, y, w, h, r) {
    var tl, tr, br, bl;
    if (Array.isArray(r)) { tl = r[0]; tr = r[1]; br = r[2]; bl = r[3]; }
    else { tl = tr = br = bl = r; }
    var m = Math.min(w / 2, h / 2);
    tl = Math.min(tl, m); tr = Math.min(tr, m); br = Math.min(br, m); bl = Math.min(bl, m);
    c.beginPath();
    c.moveTo(x + tl, y);
    c.lineTo(x + w - tr, y);
    c.quadraticCurveTo(x + w, y, x + w, y + tr);
    c.lineTo(x + w, y + h - br);
    c.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
    c.lineTo(x + bl, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - bl);
    c.lineTo(x, y + tl);
    c.quadraticCurveTo(x, y, x + tl, y);
    c.closePath();
  }

  /* ============================================================
     STATE  (pure function of t)
     ============================================================ */
  function computeState(t) {
    var st = { t: t };
    st.barP = BAR_WINDOWS.map(function (w) { return easeOut(prog(t, w[0], w[1])); });
    st.labelSlide = DATA.map(function (_, i) { return easeOut(prog(t, 0.05 + i * 0.16, 0.85 + i * 0.16)); });
    st.planP = PLAN.map(function (p) { return easeInOut(prog(t, p.change[0], p.change[1])); });
    st.annP = st.planP[0];
    st.annPulse = st.planP[5];
    st.contrast = st.planP[6];
    st.tax = st.planP[7];
    st.osc = 0.5 + 0.5 * Math.sin(t * 5.0);
    return st;
  }

  /* ============================================================
     DRAWING
     ============================================================ */
  var FONT = '"Segoe UI", -apple-system, system-ui, sans-serif';

  function drawBackground() {
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#ffffff');
    bg.addColorStop(1, '#e9eef5');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
  }

  function drawHeader() {
    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#0f172a';
    ctx.font = '700 34px ' + FONT;
    ctx.fillText('Net Worth by Occupation', 60, 72);

    ctx.fillStyle = '#64748b';
    ctx.font = '400 17px ' + FONT;
    ctx.fillText('Net worth in USD  ·  six categories  ·  off-scale annotation for ultra-rich households', 60, 102);
    ctx.restore();
  }

  function drawAxes(st) {
    ctx.save();

    /* gridlines + tick labels */
    var ticks = [0, 25000, 50000, 75000, 100000];
    ctx.font = '400 14px ' + FONT;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < ticks.length; i++) {
      var v = ticks[i];
      var y = yS(v);
      ctx.beginPath();
      ctx.moveTo(PLOT.x, y);
      ctx.lineTo(PLOT.x + PLOT.w, y);
      ctx.strokeStyle = v === 0 ? '#8fa3bb' : '#e3e9f0';
      ctx.lineWidth = v === 0 ? (2 + 2 * st.contrast) : 1;
      ctx.stroke();
      ctx.fillStyle = v === 0 ? '#475569' : '#94a3b8';
      ctx.fillText(v === 0 ? '$0' : '$' + v.toLocaleString('en-US'), PLOT.x - 16, y);
    }

    /* y-axis line */
    ctx.beginPath();
    ctx.moveTo(PLOT.x, PLOT.y - 6);
    ctx.lineTo(PLOT.x, PLOT.y + PLOT.h);
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    /* y-axis title */
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#64748b';
    ctx.font = '600 13px ' + FONT;
    ctx.fillText('Net worth (USD)', PLOT.x, PLOT.y - 18);

    /* category labels (always visible; gentle slide-in) */
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '600 15px ' + FONT;
    ctx.fillStyle = '#334155';
    for (var k = 0; k < DATA.length; k++) {
      var dy = (1 - st.labelSlide[k]) * 9;
      ctx.fillText(DATA[k].name, CENTERS[k], 616 + dy);
    }

    ctx.restore();
  }

  function drawBars(st) {
    for (var i = 0; i < DATA.length; i++) {
      var d = DATA[i];
      var p = st.barP[i];
      if (p <= 0.0005) continue;

      var yv = yS(d.value * p);
      var top, bot;
      if (d.value >= 0) {
        top = Math.min(yv, ZERO - 4);
        bot = ZERO;
      } else {
        top = ZERO;
        bot = Math.max(yv, ZERO + 4);
      }
      var h = bot - top;
      var x = CENTERS[i] - BARW / 2;

      ctx.save();
      if (st.contrast > 0.01) {
        ctx.shadowColor = 'rgba(37,99,235,' + (0.45 * st.contrast) + ')';
        ctx.shadowBlur = 26 * st.contrast;
      }
      var g = ctx.createLinearGradient(0, top, 0, bot);
      if (d.value < 0) {
        g.addColorStop(0, '#fca5a5');
        g.addColorStop(1, '#dc2626');
      } else {
        g.addColorStop(0, '#7db3fb');
        g.addColorStop(1, '#2563eb');
      }
      ctx.fillStyle = g;
      roundRect(ctx, x, top, BARW, h, d.value < 0 ? [0, 0, 8, 8] : [8, 8, 0, 0]);
      ctx.fill();
      ctx.restore();

      /* value label */
      var la = clamp01((p - 0.55) / 0.45);
      if (la > 0.01) {
        ctx.save();
        ctx.globalAlpha = la;
        ctx.textAlign = 'center';
        ctx.font = '700 18px ' + FONT;
        if (d.value < 0) {
          ctx.textBaseline = 'top';
          ctx.fillStyle = '#b91c1c';
          ctx.fillText(d.fmt, CENTERS[i], bot + 10);
        } else {
          ctx.textBaseline = 'bottom';
          ctx.fillStyle = '#1e3a8a';
          ctx.fillText(d.fmt, CENTERS[i], top - 10);
        }
        ctx.restore();
      }
    }
  }

  function drawAnnotation(st) {
    var a = st.annP;
    if (a <= 0.002) return;

    var pulse = st.annPulse;
    var tax = st.tax;
    var ac = mix([245, 158, 11], [16, 185, 129], tax);
    var R = Math.round(ac[0]), G = Math.round(ac[1]), B = Math.round(ac[2]);
    var acStr = 'rgb(' + R + ',' + G + ',' + B + ')';
    function acA(alpha) { return 'rgba(' + R + ',' + G + ',' + B + ',' + alpha + ')'; }

    var cx = 1126, topY = 168, botY = 540;

    ctx.save();
    ctx.globalAlpha = a;

    /* off-scale arrow */
    ctx.beginPath();
    ctx.moveTo(cx, botY);
    ctx.lineTo(cx, topY + 16);
    ctx.strokeStyle = acStr;
    ctx.lineWidth = 2.5 + 2.0 * pulse + 1.5 * pulse * st.osc;
    ctx.setLineDash([9, 7]);
    ctx.lineDashOffset = -((st.t * 26) % 16);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;

    /* arrowhead */
    ctx.beginPath();
    ctx.moveTo(cx, topY - 6);
    ctx.lineTo(cx - 13, topY + 20);
    ctx.lineTo(cx + 13, topY + 20);
    ctx.closePath();
    ctx.fillStyle = acStr;
    ctx.fill();

    /* pulsing ring at the arrow tip */
    if (pulse > 0.01) {
      ctx.beginPath();
      ctx.arc(cx, topY - 6, 10 + 14 * pulse * (0.4 + 0.6 * st.osc), 0, Math.PI * 2);
      ctx.strokeStyle = acA(0.55 * pulse * (0.35 + 0.65 * st.osc));
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    /* banner */
    var bx = 980, by = 44, bw = 292, bh = 68;
    roundRect(ctx, bx, by, bw, bh, 12);
    ctx.fillStyle = acA(0.07 + 0.13 * pulse + 0.10 * tax);
    ctx.fill();
    ctx.strokeStyle = acStr;
    ctx.lineWidth = 1.8 + 1.6 * pulse;
    ctx.setLineDash([7, 6]);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#0f172a';
    ctx.font = '700 19px ' + FONT;
    ctx.fillText('Ultra-rich households', bx + bw / 2, by + 25);
    ctx.fillStyle = '#64748b';
    ctx.font = '400 12.5px ' + FONT;
    ctx.fillText('net worth far beyond the displayed axis', bx + bw / 2, by + 48);

    /* wealth-tax pill */
    if (tax > 0.01) {
      ctx.globalAlpha = a * tax;
      var pw = 178, ph = 26, px = cx - pw / 2, py = 120;
      roundRect(ctx, px, py, pw, ph, 13);
      ctx.fillStyle = '#10b981';
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 14px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Wealth tax target', cx, py + 13);
      ctx.globalAlpha = a;
    }

    ctx.restore();
  }

  function drawOverlays(st) {
    if (st.contrast > 0.01) {
      ctx.save();
      ctx.globalAlpha = st.contrast;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#1e293b';
      ctx.font = '600 16px ' + FONT;
      ctx.fillText('Ordinary occupations: -$4,000 to $110,000 net worth', 640, 146);
      ctx.fillStyle = '#b45309';
      ctx.font = '600 16px ' + FONT;
      ctx.fillText('Ultra-rich households: far beyond the displayed axis', 640, 170);
      ctx.restore();
    }
  }

  function draw(st) {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawHeader();
    drawAxes(st);
    drawBars(st);
    drawAnnotation(st);
    drawOverlays(st);
  }

  /* ============================================================
     SUBTITLES
     ============================================================ */
  var subEl = document.getElementById('subtitle');
  var curText = null;

  function subtitleAt(t) {
    var s = SENTENCES[0];
    for (var i = 0; i < SENTENCES.length; i++) {
      if (t >= SENTENCES[i].start - 0.001) s = SENTENCES[i];
    }
    return s ? s.text : '';
  }

  function updateSubtitle(t) {
    var txt = subtitleAt(t);
    if (txt !== curText) {
      curText = txt;
      subEl.textContent = txt;
    }
  }

  /* ============================================================
     TIME-ADDRESSABLE RENDER
     ============================================================ */
  function renderAt(t) {
    var tt = Number(t);
    if (!isFinite(tt)) tt = 0;
    tt = Math.max(0, Math.min(tt, DURATION));
    var st = computeState(tt);
    draw(st);
    updateSubtitle(tt);
  }
  window.renderAt = renderAt;

  /* ============================================================
     PLAYBACK
     ============================================================ */
  var audio = document.getElementById('tts');
  var playBtn = document.getElementById('play');
  var T = 0;
  var playing = false;
  var lastFrame = 0;

  function updatePlayBtn() {
    playBtn.textContent = playing ? '❚❚ Pause' : '▶ Play';
  }

  function loop(now) {
    if (playing) {
      if (!lastFrame) lastFrame = now;
      var dt = Math.min(0.12, (now - lastFrame) / 1000);
      lastFrame = now;

      var nt;
      if (audio && !audio.paused && audio.readyState >= 2 && isFinite(audio.currentTime)) {
        nt = audio.currentTime;
      } else {
        nt = T + dt;
      }

      if (nt >= DURATION) {
        T = DURATION;
        renderAt(T);
        playing = false;
        updatePlayBtn();
        try { audio.pause(); } catch (e) {}
      } else {
        T = nt;
        renderAt(T);
      }
    }
    requestAnimationFrame(loop);
  }

  playBtn.addEventListener('click', function () {
    if (playing) {
      playing = false;
      try { audio.pause(); } catch (e) {}
    } else {
      if (T >= DURATION - 0.001) T = 0;
      playing = true;
      lastFrame = 0;
      try {
        if (audio) {
          audio.currentTime = T;
          var pr = audio.play();
          if (pr && pr.catch) pr.catch(function () {});
        }
      } catch (e) {}
    }
    updatePlayBtn();
  });

  if (audio) {
    audio.addEventListener('ended', function () {
      if (playing && T >= DURATION - 0.15) {
        playing = false;
        updatePlayBtn();
      }
    });
  }

  /* ============================================================
     BOOT
     ============================================================ */
  var params = new URLSearchParams(location.search);
  var tParam = params.get('t');
  if (tParam !== null && tParam !== '' && isFinite(parseFloat(tParam))) {
    T = Math.max(0, Math.min(parseFloat(tParam), DURATION));
  } else {
    T = 0;
  }

  renderAt(T);
  updatePlayBtn();
  requestAnimationFrame(loop);
})();
</script>

<script>
(function(){
  var p=new URLSearchParams(location.search).get("t");
  function seek(){
    var a=document.getElementById("tts")||document.querySelector("audio");
    if(p!==null&&a){a.currentTime=parseFloat(p);}
    if(p!==null&&window.renderAt){try{window.renderAt(parseFloat(p));}catch(e){}}
  }
  setTimeout(seek,300);
})();
</script>
</body>
